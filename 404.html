<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#10253f">
  <title>Halaman tidak ditemukan — Mohamad Arif Pramarta S.Stat.</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/Aset/favicon-transparent-32.png">
  <style>
    :root {
      color-scheme: light;
      --navy-950: #0b1b30;
      --navy-900: #10253f;
      --teal-700: #0d6570;
      --teal-800: #084e57;
      --muted: #5e6b7c;
      --line: #d9e0e8;
      --canvas: #f6f8fa;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px 16px;
      background: var(--canvas);
      color: var(--navy-950);
      font-family: "Segoe UI Variable", "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100%, 560px);
      padding: clamp(28px, 6vw, 44px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: #ffffff;
      box-shadow: 0 16px 40px rgba(18, 40, 67, 0.11);
      text-align: center;
    }
    .code {
      margin: 0;
      color: var(--teal-700);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 12px 0 10px;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 26px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 20px;
      border: 1px solid var(--teal-700);
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      text-decoration: none;
    }
    .button-primary { background: var(--teal-700); color: #ffffff; }
    .button-primary:hover { background: var(--teal-800); }
    .button-secondary { background: #ffffff; color: var(--navy-900); border-color: var(--line); }
    .button-secondary:hover { border-color: var(--navy-900); }
    .button:focus-visible { outline: 3px solid #79c5c7; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Galat 404</p>
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat yang Anda buka tidak tersedia atau sudah dipindahkan. Silakan kembali ke halaman utama untuk melihat layanan dan menghubungi saya.</p>
    <div class="actions">
      <a class="button button-primary" href="/">Kembali ke halaman utama</a>
      <a class="button button-secondary" href="/#contact-form">Diskusikan kebutuhan</a>
    </div>
  </main>
</body>
</html>
